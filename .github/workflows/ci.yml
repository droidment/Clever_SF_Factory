name: Verify factory
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: factory_test
          POSTGRES_USER: factory_test
          POSTGRES_PASSWORD: local-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U factory_test -d factory_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: pip install -r requirements.lock && pip install -e . --no-deps
      - run: python -m ruff check factory gateway tests
      - run: python -m pytest -q
      - name: Backend tests on PostgreSQL (row locking, leases, advisory lock)
        run: python -m pytest -q
        env:
          FACTORY_TEST_DATABASE_URL: postgresql+psycopg://factory_test:local-test-only@localhost:5432/factory_test
      - run: npm --prefix web ci && npm --prefix web run build
      - run: cd web && npx playwright install --with-deps chromium
      - run: npm --prefix web run test:e2e
