name: Verify factory
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: pip install -r requirements.lock && pip install -e . --no-deps
      - run: python -m ruff check factory tests
      - run: python -m pytest -q
      - run: RUN_TEMPORAL_TESTS=1 python -m pytest tests/test_temporal.py -q
      - run: npm --prefix web ci && npm --prefix web run build
      - run: cd web && npx playwright install --with-deps chromium
      - run: npm --prefix web run test:e2e
